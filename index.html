<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fenestration Software Capability Benchmark — GlassBuild 2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-wm: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #fff; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    button.filter-btn { background: #334155; border: none; color: #e2e8f0; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
    button.filter-btn:hover { background: #475569; }
    button.filter-btn.active { background: var(--accent); color: #0f172a; font-weight: 700; }
    .chart-grid { display: flex; flex-direction: column; gap: 1.5rem; }
    .capability-row { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #1e293b; }
    .cap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .cap-title { font-weight: 600; font-size: 0.95rem; }
    .cap-note { font-size: 0.8rem; color: var(--accent); }
    .bars-container { display: flex; flex-direction: column; gap: 0.4rem; }
    .bar-line { display: grid; grid-template-columns: 180px 1fr 40px; align-items: center; gap: 0.75rem; }
    .bar-label { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
    .bar-track { background: #1e293b; height: 16px; border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease-in-out; }
    .bar-score { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; }
    .wm-proposed .bar-fill { background: linear-gradient(90deg, #10b981, #34d399); }
    .wm-current .bar-fill { background: #3b82f6; }
    .competitor .bar-fill { background: #64748b; }
    .footer-note { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fenestration Software Capability Benchmark</h1>
    <p class="subtitle">Competitive research observations from GlassBuild America 2026 vs. Proposed Product Enhancements.</p>

    <div class="controls">
      <button class="filter-btn active" onclick="setFilter('all')">Compare All Platforms</button>
      <button class="filter-btn" onclick="setFilter('wm-delta')">Windowmaker Current vs. Proposed</button>
      <button class="filter-btn" onclick="setFilter('logikal')">Windowmaker vs. Orgadata (LogiKal)</button>
    </div>

    <div class="chart-grid" id="chartGrid"></div>

    <div class="footer-note">
      <span>Scored 1 (Manual/None) to 5 (Automated/Zero-Friction)</span>
      <span>Elena Camelia Simion — Product Innovation Brief</span>
    </div>
  </div>

  <script>
    const capabilities = [
      {
        name: "Mobile / QR Shop Floor Tracking",
        note: "Major competitive blind spot: legacy players demand rugged scanners or terminal PCs.",
        scores: { "Windowmaker (+Proposed)": 5, "Windowmaker (Current)": 2, "Orgadata / LogiKal": 2, "FeneTech": 3, "Cantor / Friedman": 2 }
      },
      {
        name: "Defect / Snag Photo Capture",
        note: "Proposed: 1-tap mobile upload vs. competitors' manual paper discrepancy logs.",
        scores: { "Windowmaker (+Proposed)": 5, "Windowmaker (Current)": 1, "Orgadata / LogiKal": 1, "FeneTech": 2, "Cantor / Friedman": 1 }
      },
      {
        name: "Offcut Scrap Reclaim Loop",
        note: "Closing the cut loop back into sales order entry reduces raw stock pull.",
        scores: { "Windowmaker (+Proposed)": 5, "Windowmaker (Current)": 2, "Orgadata / LogiKal": 3, "FeneTech": 3, "Cantor / Friedman": 2 }
      },
      {
        name: "Client Visual Sign-Off Portal",
        note: "Dynamic web sign-off resolves spec disputes before batch extrusion cutting.",
        scores: { "Windowmaker (+Proposed)": 5, "Windowmaker (Current)": 2, "Orgadata / LogiKal": 2, "FeneTech": 2, "Cantor / Friedman": 1 }
      },
      {
        name: "Core CAD & Parametric BOM",
        note: "Parity across tier-1 platforms; industry baseline.",
        scores: { "Windowmaker (+Proposed)": 5, "Windowmaker (Current)": 5, "Orgadata / LogiKal": 5, "FeneTech": 5, "Cantor / Friedman": 4 }
      }
    ];

    let currentFilter = 'all';

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderChart();
    }

    function renderChart() {
      const grid = document.getElementById('chartGrid');
      grid.innerHTML = '';

      capabilities.forEach(cap => {
        let platforms = [];
        if (currentFilter === 'all') {
          platforms = ["Windowmaker (+Proposed)", "Windowmaker (Current)", "Orgadata / LogiKal", "FeneTech", "Cantor / Friedman"];
        } else if (currentFilter === 'wm-delta') {
          platforms = ["Windowmaker (+Proposed)", "Windowmaker (Current)"];
        } else if (currentFilter === 'logikal') {
          platforms = ["Windowmaker (+Proposed)", "Windowmaker (Current)", "Orgadata / LogiKal"];
        }

        const row = document.createElement('div');
        row.className = 'capability-row';

        let barsHtml = platforms.map(p => {
          const score = cap.scores[p];
          const pct = (score / 5) * 100;
          let cssClass = 'competitor';
          if (p === 'Windowmaker (+Proposed)') cssClass = 'wm-proposed';
          else if (p === 'Windowmaker (Current)') cssClass = 'wm-current';

          return `
            <div class="bar-line ${cssClass}">
              <span class="bar-label">${p}</span>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${pct}%"></div>
              </div>
              <span class="bar-score">${score}/5</span>
            </div>
          `;
        }).join('');

        row.innerHTML = `
          <div class="cap-header">
            <span class="cap-title">${cap.name}</span>
            <span class="cap-note">${cap.note}</span>
          </div>
          <div class="bars-container">${barsHtml}</div>
        `;
        grid.appendChild(row);
      });
    }

    renderChart();
  </script>
</body>
</html>
